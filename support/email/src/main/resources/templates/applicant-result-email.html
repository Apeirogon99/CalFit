<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalFit 전형 결과 안내</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background: #eef2ff; font-family: 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif; color: #0f172a;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width: 680px; border-collapse: collapse;">
            <tr>
              <td
                th:style="${isAccepted} ? 'padding: 18px 22px; background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); border-radius: 28px 28px 0 0; color: #ffffff;' : 'padding: 18px 22px; background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); border-radius: 28px 28px 0 0; color: #ffffff;'">
                <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.78;">
                  Recruitment Update
                </div>
                <div style="margin-top: 10px; font-size: 26px; font-weight: 700; line-height: 1.35;" th:text="${headline}">
                  전형 결과 안내
                </div>
              </td>
            </tr>
            <tr>
              <td style="background: #ffffff; border-radius: 0 0 28px 28px; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.12);">
                <div style="padding: 32px 32px 12px;">
                  <div style="display: inline-block; padding: 8px 14px; border-radius: 999px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 13px; color: #334155;">
                    <span th:text="${companyName}">CalFit</span>
                    <span style="margin: 0 6px; color: #94a3b8;">|</span>
                    <span th:text="${positionName}">포지션</span>
                  </div>

                  <p style="margin: 24px 0 0; font-size: 16px; line-height: 1.8;">
                    <strong th:text="${applicantName}">지원자</strong>님, 안녕하세요.
                  </p>
                  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.8; color: #334155;">
                    <strong th:text="${positionName}">포지션</strong> 전형과 관련해 현재 진행 상황을 안내드립니다.
                  </p>

                  <div style="margin-top: 24px; padding: 24px; border-radius: 20px; background: #f8fafc; border: 1px solid #e2e8f0;">
                    <div style="font-size: 14px; font-weight: 700; color: #475569;">안내 내용</div>
                    <div style="margin-top: 10px; font-size: 16px; line-height: 1.8; color: #0f172a;" th:text="${summary}">
                      전형 결과가 준비되었습니다.
                    </div>
                  </div>

                  <div
                    th:if="${highlightLabel != null and highlightValue != null}"
                    style="margin-top: 18px; padding: 22px 24px; border-radius: 20px; background: #eff6ff; border: 1px solid #bfdbfe;">
                    <div style="font-size: 13px; color: #1d4ed8; font-weight: 700;" th:text="${highlightLabel}">
                      다음 전형
                    </div>
                    <div style="margin-top: 8px; font-size: 20px; font-weight: 700; color: #0f172a;" th:text="${highlightValue}">
                      1차 면접
                    </div>
                  </div>

                  <div style="margin-top: 26px; padding: 20px 22px; border-radius: 18px; background: #fefce8; border: 1px solid #fde68a; font-size: 14px; line-height: 1.7; color: #713f12;">
                    본 메일은 채용 진행 상태 안내를 위해 발송되었습니다. 이후 일정이나 추가 안내가 필요한 경우 별도 연락이 이어질 수 있습니다.
                  </div>
                </div>

                <div style="margin-top: 8px; padding: 20px 32px 32px; font-size: 13px; color: #64748b; line-height: 1.7; border-top: 1px solid #f1f5f9;">
                  <div>
                    이 메일은 <strong th:text="${companyName}">CalFit</strong> 채용 시스템에서 발송되었습니다.
                  </div>
                  <div style="margin-top: 4px;">문의가 필요한 경우 채용 담당자 안내를 따라 주세요.</div>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

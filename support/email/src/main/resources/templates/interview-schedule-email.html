<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalFit 면접 일정 안내</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background: #f8fafc; font-family: 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif; color: #0f172a;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width: 680px; border-collapse: collapse;">
            <tr>
              <td style="padding: 20px 24px; background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%); border-radius: 28px 28px 0 0; color: #ffffff;">
                <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.82;">
                  Interview Schedule
                </div>
                <div style="margin-top: 10px; font-size: 26px; font-weight: 700; line-height: 1.35;">
                  면접 일정이 확정되었습니다
                </div>
              </td>
            </tr>
            <tr>
              <td style="background: #ffffff; border-radius: 0 0 28px 28px; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.12);">
                <div style="padding: 32px;">
                  <p style="margin: 0; font-size: 16px; line-height: 1.8;">
                    <strong th:text="${applicantName}">지원자</strong>님, 안녕하세요.
                  </p>
                  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.8; color: #334155;">
                    아래와 같이 면접 일정이 확정되어 안내드립니다.
                  </p>

                  <div style="margin-top: 24px; padding: 24px; border-radius: 20px; background: #f8fafc; border: 1px solid #e2e8f0;">
                    <div style="font-size: 14px; font-weight: 700; color: #475569;">면접 일정</div>
                    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 14px; border-collapse: collapse;">
                      <tr>
                        <td style="padding: 10px 0; font-size: 14px; color: #64748b; width: 88px;">날짜</td>
                        <td style="padding: 10px 0; font-size: 16px; font-weight: 700; color: #0f172a;" th:text="${dateText}">2030년 03월 13일</td>
                      </tr>
                      <tr>
                        <td style="padding: 10px 0; font-size: 14px; color: #64748b;">시간</td>
                        <td style="padding: 10px 0; font-size: 16px; font-weight: 700; color: #0f172a;" th:text="${timeText}">14:00 - 15:00</td>
                      </tr>
                      <tr>
                        <td style="padding: 10px 0; font-size: 14px; color: #64748b;">위치</td>
                        <td style="padding: 10px 0; font-size: 16px; font-weight: 700; color: #0f172a;" th:text="${location}">면접실 A</td>
                      </tr>
                    </table>
                  </div>

                  <div style="margin-top: 24px; padding: 20px 22px; border-radius: 18px; background: #eff6ff; border: 1px solid #bfdbfe; font-size: 14px; line-height: 1.7; color: #1e3a8a;">
                    원활한 진행을 위해 면접 시간 10분 전까지 도착해 주세요.
                  </div>
                </div>

                <div style="padding: 20px 32px 32px; font-size: 13px; color: #64748b; line-height: 1.7; border-top: 1px solid #f1f5f9;">
                  <div>이 메일은 CalFit 채용 시스템에서 발송되었습니다.</div>
                  <div style="margin-top: 4px;">문의가 필요한 경우 채용 담당자 안내를 따라 주세요.</div>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

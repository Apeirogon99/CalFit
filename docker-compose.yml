services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M

  core-api:
    image: ${DOCKER_USERNAME}/final-backend:latest
    container_name: core-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      STORAGE_DATABASE_CORE_DB_URL: mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      STORAGE_DATABASE_CORE_DB_USERNAME: ${MYSQL_USER}
      STORAGE_DATABASE_CORE_DB_PASSWORD: ${MYSQL_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      S3_APPLICANT_BUCKET: ${S3_APPLICANT_BUCKET}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      PRESIGN_EXPIRE_MINUTES: ${PRESIGN_EXPIRE_MINUTES}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED}
      APP_EMAIL_SENDER: ${APP_EMAIL_SENDER}
      APP_EMAIL_API_BASE_URL: ${APP_EMAIL_API_BASE_URL}
      APP_EMAIL_FRONTEND_BASE_URL: ${APP_EMAIL_FRONTEND_BASE_URL}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE}
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED}
      SPRING_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_SMTP_SSL_ENABLE}
      JAVA_OPTS: -Xms256m -Xmx512m
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 600M

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
